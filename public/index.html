*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#F15232;--black:#000;
  --bg:#f5f5f5;--bg2:#ffffff;--bg3:#f0f0f0;--bg4:#e8e8e8;
  --border:#e0e0e0;--border2:#d0d0d0;
  --tp:#111111;--ts:#555555;--tm:#999999;
  --f:'Effra',system-ui,sans-serif;
}
html,body{font-family:var(--f);background:var(--bg);color:var(--tp);min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:2.5rem 2rem 5rem}

.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2.5rem;padding:1.5rem 2rem;background:#111;border-radius:12px;}
.dc-logo svg{height:38px;width:auto;display:block}
.agg-badge{display:flex;align-items:center;gap:10px;background:#222;border:1px solid #333;border-radius:8px;padding:8px 16px;flex-shrink:0}
.agg-logo-box{width:34px;height:34px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;font-weight:700;letter-spacing:.5px;text-align:center;line-height:1.2;flex-shrink:0}
.agg-info-name{font-size:13px;font-weight:500;color:#fff;line-height:1.3}
.agg-info-label{font-size:11px;color:#aaa;margin-top:1px}

.totals-bar{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1.25rem 2rem;display:flex;align-items:center;margin-bottom:2rem}
.total-item{flex:1;text-align:center;padding:0 1rem}
.total-item+.total-item{border-left:1px solid var(--border2)}
.tnum{font-size:30px;font-weight:700;color:var(--tp);letter-spacing:-.5px;line-height:1;display:block}
.tnum.brand{color:var(--brand)}
.tlbl{font-size:10px;color:var(--tm);margin-top:4px;letter-spacing:.5px;text-transform:uppercase;display:block}

.live-row{display:flex;align-items:center;gap:8px;margin-bottom:1.5rem}
.live-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.live-text{font-size:12px;color:var(--ts)}
.updated{font-size:12px;color:var(--tm);margin-left:auto}

.sec-title{font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--tm);margin-bottom:1rem;display:block}

.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:1.75rem}
.loc-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:1.5rem;cursor:pointer;transition:border-color .18s,transform .18s,box-shadow .18s;position:relative;overflow:hidden}
.loc-card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:transparent;transition:background .18s;border-radius:14px 14px 0 0}
.loc-card:hover{border-color:var(--brand);transform:translateY(-3px);box-shadow:0 8px 32px rgba(241,82,50,.15)}
.loc-card:hover::after,.loc-card.active::after{background:var(--brand)}
.loc-card.active{border-color:var(--brand);background:var(--bg3)}
.loc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.25rem}
.loc-name{font-size:14px;font-weight:700;color:var(--tp);line-height:1.3}
.loc-city{font-size:11px;color:var(--tm);margin-top:3px}
.loc-arrow{font-size:22px;color:var(--border2);transition:color .18s,transform .18s;line-height:1}
.loc-card:hover .loc-arrow,.loc-card.active .loc-arrow{color:var(--brand);transform:translateX(3px)}
.loc-big{font-size:40px;font-weight:700;color:var(--tp);line-height:1;letter-spacing:-2px;display:block}
.loc-unit{font-size:12px;color:var(--ts);margin-top:4px;display:block}
.loc-types{display:flex;gap:5px;margin-top:1.25rem;flex-wrap:wrap}
.tpill{font-size:10px;padding:3px 9px;border-radius:20px;background:var(--bg3);color:var(--ts);font-weight:500;border:1px solid var(--border2)}

/* loading & error */
.loading-state{text-align:center;padding:4rem 2rem;color:var(--ts)}
.loading-spinner{width:32px;height:32px;border:2px solid var(--border2);border-top-color:var(--brand);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
.error-state{text-align:center;padding:3rem 2rem;color:#f87171;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);border-radius:12px;margin-bottom:1rem}

.detail-panel{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:1rem;animation:slideIn .22s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.det-hdr{padding:1.1rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--bg3)}
.det-dot{width:9px;height:9px;border-radius:50%;background:var(--brand);flex-shrink:0}
.det-title{font-size:14px;font-weight:700;color:var(--tp)}
.det-close{margin-left:auto;width:28px;height:28px;border-radius:6px;border:1px solid var(--border2);background:var(--bg4);cursor:pointer;color:var(--ts);font-size:15px;display:flex;align-items:center;justify-content:center;transition:background .15s;font-family:var(--f)}
.det-close:hover{background:var(--border2);color:var(--tp)}

table.inv{width:100%;border-collapse:collapse}
table.inv thead tr{background:var(--bg3)}
table.inv th{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--tm);padding:11px 1.5rem;text-align:left}
table.inv th:nth-child(3),table.inv td:nth-child(3){text-align:right}
table.inv th:nth-child(4),table.inv td:nth-child(4){text-align:right}
table.inv th:last-child,table.inv td:last-child{text-align:right}
table.inv tbody tr{border-top:1px solid var(--border);transition:background .1s}
table.inv tbody tr:hover{background:var(--bg3)}
table.inv td{padding:14px 1.5rem;font-size:14px;color:var(--tp)}
.ttag{display:inline-flex;align-items:center;gap:9px;font-weight:500}
.tico{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.tico.cabin{background:#2a1f0e}.tico.open{background:#0e1f2a}.tico.vm{background:#0e2a18}.tico.meet{background:#2a0e2a}
.qty-w{display:flex;align-items:baseline;justify-content:flex-end;gap:5px}
.qty-n{font-weight:700;font-size:18px;color:var(--brand)}
.qty-u{font-size:11px;color:var(--tm)}
.price-cell{text-align:right}
.price-main{font-size:14px;font-weight:700;color:var(--tp)}
.price-gst{font-size:10px;color:var(--tm);margin-top:2px}
.abadge{font-size:10px;font-weight:700;padding:4px 11px;border-radius:20px;background:rgba(34,197,94,.12);color:#4ade80;letter-spacing:.5px;text-transform:uppercase;border:1px solid rgba(34,197,94,.2)}

/* pricing footer row */
.pricing-footer{padding:1rem 1.5rem;border-top:1px solid var(--border);background:var(--bg3);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.comm-badge{font-size:12px;color:var(--ts)}
.comm-badge b{color:var(--brand);font-weight:700}
.tnc-note{font-size:10px;color:var(--tm);font-style:italic}

/* VO card */
.vo-section{padding:1.5rem}
.vo-label{font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--tm);margin-bottom:1rem;display:block}
.vo-card{background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:1.25rem}
.vo-price-row{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
.vo-price{font-size:26px;font-weight:700;color:var(--brand);letter-spacing:-1px}
.vo-period{font-size:12px;color:var(--tm)}
.vo-gst{font-size:10px;color:var(--tm);margin-bottom:1rem}
.vo-features{list-style:none;margin-bottom:1rem}
.vo-features li{font-size:12px;color:var(--ts);padding:4px 0;display:flex;align-items:flex-start;gap:7px;border-bottom:1px solid var(--border)}
.vo-features li:last-child{border-bottom:none}
.vo-features li::before{content:'✓';color:var(--brand);font-weight:700;flex-shrink:0;margin-top:1px}
.vo-comm{font-size:11px;color:var(--ts);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.vo-comm b{color:var(--brand)}

/* branch info */
.branch-info{border-top:1px solid var(--border)}
.photo-strip{display:grid;grid-template-columns:2fr 1fr 1fr;gap:2px;height:210px;background:var(--border)}
.photo-main{overflow:hidden}
.photo-main img{width:100%;height:210px;object-fit:cover;display:block;transition:transform .5s;filter:brightness(.9)}
.photo-main:hover img{transform:scale(1.04);filter:brightness(1)}
.photo-thumb{overflow:hidden}
.photo-thumb img{width:100%;height:104px;object-fit:cover;display:block;transition:transform .5s;filter:brightness(.85)}
.photo-thumb:hover img{transform:scale(1.06);filter:brightness(1)}
.branch-meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border-top:1px solid var(--border)}
.mb{padding:1.25rem 1.5rem;border-right:1px solid var(--border)}
.mb:last-child{border-right:none}
.mlbl{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--tm);margin-bottom:8px;display:block}
.mval{font-size:13px;color:var(--tp);line-height:1.6}
.mval.sm{font-size:12px;color:var(--ts);margin-top:4px}
.amenities-block{padding:1.25rem 1.5rem;border-top:1px solid var(--border)}
.am-grid{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.am-tag{font-size:11px;padding:5px 12px;border-radius:20px;background:var(--bg3);color:var(--ts);font-weight:500;border:1px solid var(--border2)}
.am-tag::before{content:'✓ ';color:var(--brand)}
.cta-row{padding:1.25rem 1.5rem;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--bg3);flex-wrap:wrap}
.btn-p{background:var(--brand);color:#fff;border:none;padding:9px 20px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--f);text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:opacity .15s}
.btn-p:hover{opacity:.85}
.btn-o{background:transparent;color:var(--tp);border:1px solid var(--border2);padding:9px 18px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--f);text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:border-color .15s,background .15s}

<script>
const AGGREGATORS={
  JLL:{name:'JLL India',bg:'#1a3a6e'},
  CW:{name:'Cushman & Wakefield',bg:'#8b0000'},
  ADDR:{name:'The Address',bg:'#1c3a5e'},
  ANR:{name:'Anarock',bg:'#c06010'},
};

const STATIC={
  'tidel-omr':{
    photos:[
      'https://framerusercontent.com/images/XNOmn2bZjNSOZmgy2LPwWeirSDM.jpg?scale-down-to=2048',
      'https://framerusercontent.com/images/2VcjSgWudIUFyZ1jWaytWtduFg.jpg?scale-down-to=2048',
      'https://framerusercontent.com/images/9Lkp538lCkqMSWd9UuzUanW7SbY.jpg?scale-down-to=2048',
    ],
    amenities:['High-Speed Internet','Fully AC','24x7 CCTV','Biometric Access','Board & Meeting Room','Printing / Xerox','UPS & DG Backup','Beverages','Recreational Area','Housekeeping','Food Court Access','Ample Parking','Post Office','Conference Hall','Banks / ATMs','Phone Booth','EV Charging','Auditorium'],
  },
  'tidel-pat':{
    photos:[
      'https://framerusercontent.com/images/gHtYL5nYZUS8hxF5rZ4utGM4ws.jpeg?scale-down-to=2048',
      'https://framerusercontent.com/images/xY3js9oIk9ZDm4S7YztgssTM.jpeg?scale-down-to=2048',
      'https://framerusercontent.com/images/2zSH8MXbOqK6i8CpLywvPvh6ro.jpeg?scale-down-to=2048',
    ],
    amenities:['High-Speed Internet','Fully AC','24x7 CCTV','Biometric Access','Board & Meeting Room','Printing / Xerox','UPS & DG Backup','Beverages','Recreational Area','Housekeeping','Food Court Access','Ample Parking','Phone Booth','EV Charging','Auditorium'],
  },
  'perun-omr':{
    photos:[
      'https://framerusercontent.com/images/74Waskszg6n1DsA9mxCwJrg924.jpg?scale-down-to=2048',
      'https://framerusercontent.com/images/agUTbGWFXAIme2xHIscv3AZP61E.jpg?scale-down-to=2048',
      'https://framerusercontent.com/images/t54sKw1wbSPFOtfdu8h8xkBZ2k.jpeg?scale-down-to=1024',
    ],
    amenities:['High-Speed Internet','Fully AC','24x7 CCTV','Biometric Access','Meeting Room','Printing / Xerox','DG Backup','Beverages','Recreational Area','Housekeeping','Ample Parking'],
  },
};

const TYPE_ICONS={
  'Private Cabin':{icon:'cabin',emoji:'🏢'},
  'Open Workspace':{icon:'open',emoji:'💺'},
  'Meeting Room':{icon:'meet',emoji:'🤝'},
  'Board Room':{icon:'meet',emoji:'📋'},
};

let LOCATIONS=[];
let activeId=null;

function getAgg(){const p=new URLSearchParams(window.location.search);return(p.get('agg')||'JLL').toUpperCase();}
function formatINR(n){if(!n)return null;return '₹'+Number(n).toLocaleString('en-IN');}

function renderHeader(){
  const k=getAgg();const a=AGGREGATORS[k]||AGGREGATORS.JLL;
  document.getElementById('agg-logo').textContent=k.substring(0,4);
  document.getElementById('agg-logo').style.background=a.bg;
  document.getElementById('agg-name').textContent=a.name;
}

function seatCount(loc){
  return (loc.inventory||[]).reduce((s,i)=>{
    if(i.workspace_type==='Open Workspace') return s+Number(i.quantity||0);
    if(i.workspace_type==='Private Cabin') return s+(Number(i.no_of_seats||0)*Number(i.quantity||0));
    return s;
  },0);
}
function cabinCount(loc){
  return (loc.inventory||[]).filter(i=>i.workspace_type==='Private Cabin').reduce((s,i)=>s+Number(i.quantity||0),0);
}

function renderTotals(){
  document.getElementById('total-seats').textContent=LOCATIONS.reduce((s,l)=>s+seatCount(l),0);
  document.getElementById('total-cabins').textContent=LOCATIONS.reduce((s,l)=>s+cabinCount(l),0);
  document.getElementById('total-locs').textContent=LOCATIONS.length;
  const live=document.getElementById('total-live');
  live.textContent='● Live';live.style.color='#22c55e';
}

function renderGrid(){
  if(!LOCATIONS.length){
    document.getElementById('loc-grid').innerHTML='<div class="error-state">No active locations found in inventory.</div>';
    return;
  }
  document.getElementById('loc-grid').innerHTML=`<div class="summary-grid">${LOCATIONS.map(loc=>{
    const sc=seatCount(loc);
    const types=[...new Set((loc.inventory||[]).map(i=>i.workspace_type))];
    const act=activeId===loc.id?'active':'';
    return`<div class="loc-card ${act}" onclick="toggleDetail('${loc.id}')">
      <div class="loc-top"><div><div class="loc-name">${loc.name}</div><div class="loc-city">${loc.subtitle||''}</div></div><div class="loc-arrow">&#8250;</div></div>
      <span class="loc-big">${sc}</span><span class="loc-unit">available seats</span>
      <div class="loc-types">${types.map(t=>`<span class="tpill">${t}</span>`).join('')}</div>
    </div>`;
  }).join('')}</div>`;
}

function renderDetail(id){
  const loc=LOCATIONS.find(l=>l.id===id);
  if(!loc)return'';
  const st=STATIC[id]||{photos:[],amenities:[]};
  const pricing=loc.pricing||{};
  const priceFormatted=formatINR(pricing.price_per_seat_month);
  const commission=pricing.aggregator_commission||'';

  // Inventory rows
  const rows=(loc.inventory||[])
    .sort((a,b)=>Number(a.display_order||99)-Number(b.display_order||99))
    .map(item=>{
      const ti=TYPE_ICONS[item.workspace_type]||{icon:'open',emoji:'📦'};
      const seatsCell=item.no_of_seats?`<strong>${item.no_of_seats}</strong>`:`<span style="color:var(--tm)">&#8212;</span>`;
      const priceCell=priceFormatted?`<div class="price-cell"><div class="price-main">${priceFormatted}</div><div class="price-gst">per seat / mo + 18% GST</div></div>`:`<span style="color:var(--tm);font-size:12px">Contact</span>`;
      return`<tr>
        <td><span class="ttag"><span class="tico ${ti.icon}">${ti.emoji}</span>${item.workspace_type}</span></td>
        <td>${seatsCell}</td>
        <td><div class="qty-w"><span class="qty-n">${item.quantity}</span><span class="qty-u">${item.unit_label||'units'}</span></div></td>
        <td>${priceCell}</td>
        <td><span class="abadge">Available</span></td>
      </tr>`;
    }).join('');

  // VO section
  let voHtml='';
  if(loc.vo_pricing&&loc.vo_pricing.length>0){
    const vo=loc.vo_pricing[0];
    const voPrice=formatINR(vo.price_per_year);
    const features=(vo.features||'').split('\n').filter(f=>f.trim());
    voHtml=`<div class="vo-section">
      <span class="vo-label">Virtual Office</span>
      <div class="vo-card">
        <div class="vo-price-row"><span class="vo-price">${voPrice||'Contact'}</span><span class="vo-period">/ year</span></div>
        <div class="vo-gst">+ 18% GST</div>
        ${features.length?`<ul class="vo-features">${features.map(f=>`<li>${f.trim()}</li>`).join('')}</ul>`:''}
        ${vo.aggregator_commission?`<div class="vo-comm">Aggregator cut: <b>${vo.aggregator_commission}</b> &nbsp;·&nbsp; <span style="font-style:italic;font-size:10px">Subject to T&C. Final % on confirmation.</span></div>`:''}
      </div>
    </div>`;
  }

  // Amenities
  const ams=(st.amenities||[]).map(a=>`<span class="am-tag">${a}</span>`).join('');
  const photos=st.photos||[];
  const mailto='mailto:hello@dotcoworking.com?subject=Enquiry: '+encodeURIComponent((loc.name||'')+' '+(loc.subtitle||''));

  return`<div class="detail-panel">
    <div class="det-hdr"><div class="det-dot"></div><div class="det-title">${loc.name} &middot; ${loc.subtitle||''}</div><button class="det-close" onclick="closeDetail()">&#10005;</button></div>

    <table class="inv">
      <thead><tr><th>Workspace Type</th><th>Seats / Unit</th><th>Quantity</th><th>Price / Seat / Mo</th><th>Status</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="5" style="text-align:center;color:var(--tm);padding:2rem">No available inventory</td></tr>'}</tbody>
    </table>

    ${commission?`<div class="pricing-footer"><span class="comm-badge">Aggregator commission: <b>${commission}</b></span><span class="tnc-note">*Subject to T&C. Final % confirmed on deal closure.</span></div>`:''}

    ${voHtml}

    ${photos.length?`<div class="branch-info">
      <div class="photo-strip">
        <div class="photo-main"><img src="${photos[0]}" alt="${loc.name}" loading="lazy"/></div>
        <div class="photo-thumb"><img src="${photos[1]||photos[0]}" alt="" loading="lazy"/></div>
        <div class="photo-thumb"><img src="${photos[2]||photos[0]}" alt="" loading="lazy"/></div>
      </div>
      <div class="branch-meta">
        <div class="mb"><span class="mlbl">Address</span><div class="mval sm">${loc.address||''}</div></div>
        <div class="mb"><span class="mlbl">Contact</span><div class="mval">+91 78068 98198</div><div class="mval sm">manager@dotcoworking.com</div></div>
        <div class="mb"><span class="mlbl">About</span><div class="mval sm" style="color:var(--ts)">${loc.tagline||''}</div></div>
      </div>
      ${ams?`<div class="amenities-block"><span class="mlbl">Facilities &amp; Amenities</span><div class="am-grid">${ams}</div></div>`:''}
      <div class="cta-row">
        <a class="btn-p" href="${mailto}">&#9993; Enquire Now</a>
        ${loc.maps_url?`<a class="btn-o" href="${loc.maps_url}" target="_blank">&#9675; Get Directions</a>`:''}
        ${loc.website_url?`<a class="view-full" href="${loc.website_url}" target="_blank">View full location page &#8250;</a>`:''}
      </div>
    </div>`:''}
  </div>`;
}

function toggleDetail(id){
  if(activeId===id){closeDetail();return;}
  activeId=id;renderGrid();
  document.getElementById('detail-wrap').innerHTML=renderDetail(id);
  setTimeout(()=>{document.getElementById('detail-wrap').scrollIntoView({behavior:'smooth',block:'nearest'});},80);
}
function closeDetail(){activeId=null;renderGrid();document.getElementById('detail-wrap').innerHTML='';}

function updateTime(){
  const n=new Date();const h=n.getHours()%12||12;
  const m=String(n.getMinutes()).padStart(2,'0');
  const ap=n.getHours()>=12?'PM':'AM';
  document.getElementById('updated-time').textContent=`Last synced: ${h}:${m} ${ap}`;
}

async function loadInventory(){
  document.getElementById('loc-grid').innerHTML='<div class="loading-state"><div class="loading-spinner"></div><div>Fetching live inventory...</div></div>';
  try{
    const res=await fetch('/api/inventory');
    const data=await res.json();
    if(data.status==='success'&&data.locations){
      LOCATIONS=data.locations;
      renderTotals();
      renderGrid();
      updateTime();
    } else {
      throw new Error(JSON.stringify(data));
    }
  } catch(e){
    document.getElementById('loc-grid').innerHTML=`<div class="error-state">Failed to load inventory. Please refresh.<br/><small style="opacity:.5">${e.message}</small></div>`;
    document.getElementById('total-live').textContent='● Error';
    document.getElementById('total-live').style.color='#f87171';
  }
}

renderHeader();
loadInventory();
setInterval(loadInventory, 60000);
</script>
</body>
</html>
