<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Contracts · DOT Cowork</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#F15232;--brand-light:rgba(241,82,50,.1);
  --bg:#fafafa;--surface:#fff;--surface2:#f5f5f7;--surface3:#ebebed;
  --border:rgba(0,0,0,.08);--border2:rgba(0,0,0,.12);
  --txt:#1d1d1f;--txt2:#6e6e73;--txt3:#aeaeb2;
  --avail:#1a8a3c;--avail-bg:rgba(26,138,60,.07);--avail-bd:rgba(26,138,60,.25);
  --occ:#c0392b;--occ-bg:rgba(192,57,43,.07);--occ-bd:rgba(192,57,43,.25);
  --warn:#b45309;--warn-bg:rgba(217,119,6,.09);--warn-bd:rgba(217,119,6,.3);
  --info:#1d4ed8;--info-bg:rgba(37,99,235,.07);--info-bd:rgba(37,99,235,.25);
  --radius:16px;--radius-sm:10px;--radius-xs:7px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --shadow:0 2px 8px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.04);
  --f:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{font-family:var(--f);background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}

/* header */
.hdr{background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 2rem;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.hdr-left{display:flex;align-items:center;gap:12px}
.back{color:var(--brand);font-size:13px;font-weight:500;text-decoration:none}
.hdiv{width:1px;height:16px;background:var(--border2)}
.hloc{font-size:13px;font-weight:600}
.tabbar{display:flex;gap:2px;background:var(--surface2);border-radius:50px;padding:3px}
.tabbtn{padding:6px 14px;border-radius:50px;border:none;background:transparent;font-size:12.5px;font-weight:600;color:var(--txt2);cursor:pointer;text-decoration:none;white-space:nowrap}
.tabbtn:hover{color:var(--txt)}
.tabbtn.active{background:var(--surface);color:var(--txt);box-shadow:var(--shadow-sm)}
.linkbtn{background:none;border:none;font-size:12px;color:var(--txt2);cursor:pointer}
.linkbtn:hover{color:var(--txt)}

.main{max-width:1380px;margin:0 auto;padding:2rem 2rem 6rem}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:1.25rem}
.pill-select,.search{padding:9px 14px;border-radius:50px;border:1px solid var(--border2);background:var(--surface);font-size:13px;color:var(--txt);box-shadow:var(--shadow-sm);outline:none}
.search{min-width:260px}
.search:focus,.pill-select:focus{border-color:var(--brand)}
.spacer{margin-left:auto}
.btn{padding:9px 16px;border-radius:50px;border:none;background:var(--brand);color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{opacity:.9}

/* summary */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:1.5rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:1rem 1.1rem;box-shadow:var(--shadow-sm)}
.card .k{font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--txt3)}
.card .v{font-size:24px;font-weight:700;letter-spacing:-.4px;margin-top:6px}
.card .s{font-size:12px;color:var(--txt2);margin-top:2px}
.card.warn .v{color:var(--warn)}
.card.bad .v{color:var(--occ)}

/* sections */
.sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem 1.5rem;box-shadow:var(--shadow);margin-bottom:1.5rem}
.sec-h{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--txt3);margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}

/* occupancy */
.occ{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.cab{border-radius:var(--radius-xs);border:1.5px solid var(--avail-bd);background:var(--avail-bg);padding:9px 10px;cursor:pointer;text-align:left;min-height:66px;font-size:12px}
.cab b{font-size:13px;display:block}
.cab small{display:block;color:var(--txt2);margin-top:2px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cab.occ-ok{border-color:var(--occ-bd);background:var(--occ-bg)}
.cab.occ-warn{border-color:var(--warn-bd);background:var(--warn-bg)}
.cab.occ-bad{border-color:var(--occ);background:var(--occ-bg)}
.cab:hover{box-shadow:var(--shadow)}
.legend{display:flex;gap:14px;font-size:11px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--txt2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:50px;border:1px solid var(--border2);background:var(--surface);font-size:12px;font-weight:500;color:var(--txt2);cursor:pointer}
.chip.on{background:var(--txt);color:#fff;border-color:var(--txt)}
.chip em{font-style:normal;opacity:.6;margin-left:4px}

/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--txt3);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:none}
td .sub{font-size:12px;color:var(--txt2);margin-top:2px}
.co{font-weight:600}
.tag{display:inline-block;padding:2px 8px;border-radius:50px;font-size:11px;font-weight:600;margin:0 4px 4px 0;background:var(--surface2);color:var(--txt2)}
.badge{display:inline-block;padding:3px 10px;border-radius:50px;font-size:11px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.b-active{background:var(--avail-bg);color:var(--avail);border-color:var(--avail-bd)}
.b-expiring{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-bd)}
.b-expired{background:var(--occ-bg);color:var(--occ);border-color:var(--occ-bd)}
.b-upcoming{background:var(--info-bg);color:var(--info);border-color:var(--info-bd)}
.b-terminated{background:var(--surface2);color:var(--txt2);border-color:var(--border2)}
.days-warn{color:var(--warn);font-weight:600}
.days-bad{color:var(--occ);font-weight:600}
.actions{display:flex;gap:6px;white-space:nowrap}
.abtn{padding:5px 10px;border-radius:6px;border:1px solid var(--border2);background:var(--surface);font-size:12px;font-weight:500;cursor:pointer;color:var(--txt2)}
.abtn:hover{border-color:rgba(0,0,0,.2);color:var(--txt)}
.abtn.danger{color:var(--occ);border-color:var(--occ-bd)}
.abtn.danger:hover{background:var(--occ-bg)}
.rsel{padding:4px 6px;border-radius:6px;border:1px solid var(--border2);background:var(--surface);font-size:12px}
.empty{padding:2.5rem 1rem;text-align:center;color:var(--txt3);font-size:13px}
.empty button{margin-left:6px}

/* banner */
#banner{display:none;margin-bottom:1rem;padding:11px 14px;border-radius:var(--radius-xs);font-size:13px}
#banner.ok{display:block;background:var(--avail-bg);color:var(--avail);border:1px solid var(--avail-bd)}
#banner.warn{display:block;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bd)}
#banner.err{display:block;background:var(--occ-bg);color:var(--occ);border:1px solid var(--occ-bd)}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:500;padding:2rem 1rem;overflow-y:auto}
.ovl.open{display:flex}
.modal{background:#fff;border-radius:20px;width:100%;max-width:640px;box-shadow:0 24px 80px rgba(0,0,0,.15)}
.m-head{padding:1.5rem 1.75rem 1rem;border-bottom:1px solid var(--border);position:relative}
.m-tag{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--brand);margin-bottom:.35rem}
.m-title{font-size:20px;font-weight:700;letter-spacing:-.3px}
.m-sub{font-size:12px;color:var(--txt2);margin-top:2px}
.m-x{position:absolute;top:1.1rem;right:1.25rem;width:30px;height:30px;border-radius:50%;border:none;background:var(--surface2);cursor:pointer;color:var(--txt2)}
.m-body{padding:1.25rem 1.75rem 1.75rem;display:flex;flex-direction:column;gap:.9rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
label.f{display:block;font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--txt3);margin-bottom:.35rem}
.m-body input,.m-body textarea{width:100%;padding:9px 12px;border-radius:var(--radius-xs);border:1px solid var(--border2);font-size:13px;outline:none;background:#fff}
.m-body input:focus,.m-body textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-light)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pchip{padding:6px 10px;border-radius:var(--radius-xs);border:1px solid var(--border2);background:var(--surface);font-size:12px;font-weight:500;cursor:pointer;color:var(--txt)}
.pchip.sel{background:var(--brand);border-color:var(--brand);color:#fff}
.pchip.dis{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.sel-row{display:grid;grid-template-columns:90px 1fr 1fr 30px;gap:8px;align-items:center;font-size:13px}
.sel-row .rm{border:none;background:var(--surface2);border-radius:50%;width:26px;height:26px;cursor:pointer;color:var(--txt2)}
.sel-hdr{font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--txt3)}
.warn-note{font-size:12px;color:var(--occ)}
.totals{font-size:13px;font-weight:600;padding:10px 12px;background:var(--surface2);border-radius:var(--radius-xs)}
.m-err{min-height:18px;font-size:12px;color:var(--occ)}
.submit{width:100%;padding:13px;border-radius:var(--radius-xs);border:none;background:var(--brand);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.submit:disabled{opacity:.5;cursor:not-allowed}
.meta{font-size:12px;color:var(--txt2);line-height:1.6;background:var(--surface2);border-radius:var(--radius-xs);padding:10px 12px}
@media(max-width:700px){.main{padding:1rem}.hdr{padding:0 1rem}.row2{grid-template-columns:1fr}.sel-row{grid-template-columns:70px 1fr 1fr 30px}}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <a class="back" href="/">← Inventory</a>
    <div class="hdiv"></div>
    <div class="hloc" id="hloc">Contracts</div>
    <div class="hdiv"></div>
    <div class="tabbar">
      <a class="tabbtn" href="/floorplan.html">Floor Plan</a>
      <a class="tabbtn" href="/floorplan.html#bookings">Bookings</a>
      <span class="tabbtn active">Contracts</span>
    </div>
  </div>
  <button class="linkbtn" onclick="signOut()">Sign out</button>
</div>

<div class="main">
  <div id="banner"></div>

  <div class="toolbar">
    <select class="pill-select" id="locSel" onchange="changeLocation(this.value)"></select>
    <input class="search" id="search" type="search" placeholder="Search company, contact, cabin…" oninput="onSearch(this.value)"/>
    <span class="spacer"></span>
    <button class="btn" onclick="openForm('create')">+ New contract</button>
  </div>

  <div id="gate" class="sec" style="display:none">
    <div class="empty">Sign in to view contracts. <button class="abtn" onclick="load()">Sign in</button></div>
  </div>

  <div id="content" style="display:none">
    <div class="cards" id="cards"></div>

    <div class="sec">
      <div class="sec-h">
        <span>Cabin occupancy</span>
        <span class="legend">
          <span><i style="background:var(--avail-bd)"></i>Vacant</span>
          <span><i style="background:var(--occ-bd)"></i>Occupied</span>
          <span><i style="background:var(--warn-bd)"></i>Expiring ≤30d</span>
          <span><i style="background:var(--occ)"></i>Expired / ≤7d</span>
        </span>
      </div>
      <div class="occ" id="occ"></div>
    </div>

    <div class="sec">
      <div class="sec-h"><span>Contracts</span><div class="chips" id="chips"></div></div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Contract</th><th>Company &amp; contact</th><th>Cabins</th><th>Seats</th><th>Monthly rent</th><th>Term</th><th>Status</th><th>Renewal</th><th></th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="ovl" id="ovl">
  <div class="modal">
    <div class="m-head">
      <button class="m-x" onclick="closeForm()">✕</button>
      <div class="m-tag" id="mTag">New contract</div>
      <div class="m-title" id="mTitle"></div>
      <div class="m-sub" id="mSub"></div>
    </div>
    <div class="m-body">
      <div id="mMeta" class="meta" style="display:none"></div>
      <div><label class="f">Company name</label><input id="fCompany" type="text" placeholder="e.g. Acme Technologies Pvt Ltd"/></div>
      <div class="row2">
        <div><label class="f">Contact person</label><input id="fPerson" type="text"/></div>
        <div><label class="f">Contact number</label><input id="fPhone" type="tel"/></div>
      </div>
      <div><label class="f">Contact email</label><input id="fEmail" type="email" placeholder="Renewal notices are sent here"/></div>
      <div class="row2">
        <div><label class="f">Start date</label><input id="fStart" type="date" oninput="renderPicker()"/></div>
        <div><label class="f">End date</label><input id="fEnd" type="date" oninput="renderPicker()"/></div>
      </div>
      <div>
        <label class="f">Cabins <span id="pickHint" style="text-transform:none;letter-spacing:0;font-weight:400"></span></label>
        <div class="pick" id="picker"></div>
      </div>
      <div id="selRows" style="display:flex;flex-direction:column;gap:8px"></div>
      <div class="totals" id="totals"></div>
      <div class="row2">
        <div><label class="f">Security deposit (₹)</label><input id="fDeposit" type="number" min="0" step="1"/></div>
        <div></div>
      </div>
      <div><label class="f">Notes</label><textarea id="fNotes" rows="2"></textarea></div>
      <div class="m-err" id="mErr"></div>
      <button class="submit" id="mSubmit" onclick="submitForm()">Save contract</button>
    </div>
  </div>
</div>

<script src="/auth.js"></script>
<script>
const DEFAULT_LOCATION='Tharamani';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n||0);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmtDate=iso=>iso?new Date(iso+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d);};
const diffDays=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);

let data=null,curLoc=DEFAULT_LOCATION,filter='current',query='',form=null;

const FILTERS=[
  ['current','Current',c=>c.phase==='active'||c.phase==='expiring'],
  ['expiring','Expiring ≤30d',c=>c.phase==='expiring'],
  ['upcoming','Upcoming',c=>c.phase==='upcoming'],
  ['expired','Expired',c=>c.phase==='expired'],
  ['terminated','Terminated',c=>c.phase==='terminated'],
  ['all','All',()=>true]
];

/* ── messages ── */
let bannerTimer=null;
function notify(msg,kind){
  const b=$('banner');
  b.className=kind||'ok';b.textContent=msg;
  clearTimeout(bannerTimer);
  if(kind!=='err')bannerTimer=setTimeout(()=>{b.className='';},6000);
}

/* ── loading ── */
async function load(retriedLoc){
  $('gate').style.display='none';
  try{
    const r=await apiFetch('/api/contracts?location='+encodeURIComponent(curLoc));
    if(r.status===401){showGate();return;}
    const d=await r.json();
    if(!r.ok||d.status!=='success'){
      $('content').style.display='none';
      notify((d.error||'Could not load contracts')+'. If the Contracts forms have not been created in Zoho Creator yet, see docs/zoho-setup.md.','err');
      return;
    }
    if(!retriedLoc&&d.locations.length&&!d.locations.some(l=>l.toLowerCase()===curLoc.toLowerCase())){
      curLoc=d.locations[0];return load(true);
    }
    data=d;
    $('banner').className='';
    render();
  }catch(e){
    notify('Could not reach the server.','err');
  }
}

function showGate(){
  $('content').style.display='none';
  $('gate').style.display='';
}

async function signOut(){
  try{await fetch('/api/auth',{method:'DELETE'});}catch(e){}
  data=null;showGate();
}

function changeLocation(v){curLoc=v;load();}
function onSearch(v){query=v.trim().toLowerCase();renderTable();}

/* ── rendering ── */
function render(){
  $('content').style.display='';
  $('hloc').textContent=curLoc+' · Contracts';
  const locs=data.locations.length?data.locations:[curLoc];
  $('locSel').innerHTML=locs.map(l=>`<option ${l.toLowerCase()===curLoc.toLowerCase()?'selected':''}>${esc(l)}</option>`).join('');
  renderCards();renderOccupancy();renderChips();renderTable();
}

function renderCards(){
  const s=data.summary;
  const pct=s.cabins_total?Math.round(s.cabins_occupied/s.cabins_total*100):0;
  $('cards').innerHTML=[
    ['Active contracts',s.active_contracts,'',''],
    ['Cabins occupied',`${s.cabins_occupied} / ${s.cabins_total}`,`${pct}% occupancy`,''],
    ['Seats occupied',s.seats_occupied,'',''],
    ['Monthly revenue',inr(s.monthly_recurring_revenue),'from active contracts',''],
    ['Expiring ≤30 days',s.expiring_30,`${s.expiring_60} in 60 · ${s.expiring_90} in 90`,s.expiring_30?'warn':''],
    ['Renewals pending',s.renewals_pending,s.overdue?`${s.overdue} expired, no action taken`:'nothing overdue',s.overdue?'bad':(s.renewals_pending?'warn':'')]
  ].map(([k,v,sub,cls])=>`<div class="card ${cls}"><div class="k">${k}</div><div class="v">${esc(v)}</div><div class="s">${esc(sub)}</div></div>`).join('');
}

function renderOccupancy(){
  if(!data.cabins.length){
    $('occ').innerHTML='<div class="empty" style="grid-column:1/-1">No leasable cabins found for this location. Cabins are picked up from Inventory Items whose Workspace Type contains "cabin".</div>';
    return;
  }
  $('occ').innerHTML=data.cabins.map(c=>{
    let cls='',line='Vacant';
    if(c.state==='occupied'){
      const d=c.contract.days_to_expiry;
      cls=d<=7?'occ-bad':(d<=30?'occ-warn':'occ-ok');
      line=`${esc(c.contract.company_name)}<br>${d} day${d===1?'':'s'} left`;
    }else if(c.state==='overdue'){
      cls='occ-bad';line=`${esc(c.contract.company_name)}<br>Expired ${fmtDate(c.contract.end_date)}`;
    }else if(c.next_contract){
      line=`Leased from ${fmtDate(c.next_contract.start_date)}`;
    }
    const act=c.contract?`openForm('edit','${esc(c.contract.contract_id)}')`:`openForm('create',null,'${esc(c.item_id)}')`;
    return `<button class="cab ${cls}" onclick="${act}"><b>${esc(c.cabin_number)}</b><small>${c.seats} seat${c.seats===1?'':'s'}</small><small>${line}</small></button>`;
  }).join('');
}

function renderChips(){
  $('chips').innerHTML=FILTERS.map(([key,label,fn])=>{
    const n=data.contracts.filter(fn).length;
    return `<button class="chip ${filter===key?'on':''}" onclick="setFilter('${key}')">${label}<em>${n}</em></button>`;
  }).join('');
}

function setFilter(k){filter=k;renderChips();renderTable();}

function phaseBadge(c){
  switch(c.phase){
    case 'active':return '<span class="badge b-active">Active</span>';
    case 'expiring':return '<span class="badge b-expiring">Expiring</span>';
    case 'expired':return '<span class="badge b-expired">Expired</span>';
    case 'upcoming':return '<span class="badge b-upcoming">Upcoming</span>';
    default:return '<span class="badge b-terminated">Terminated</span>';
  }
}

function daysLeft(c){
  if(c.phase==='terminated')return `<span class="sub">${c.terminated_on?fmtDate(c.terminated_on):''}</span>`;
  if(c.phase==='upcoming')return `starts in ${diffDays(data.today,c.start_date)}d`;
  const d=c.days_to_expiry;
  if(d<0)return `<span class="days-bad">${-d}d ago</span>`;
  return `<span class="${d<=7?'days-bad':(d<=30?'days-warn':'')}">${d}d left</span>`;
}

function renewalCell(c){
  if(c.phase==='terminated')return '<span class="sub">—</span>';
  const opts=['Not Due','Notice Sent','Renewed','Declined'].map(o=>`<option ${o===c.renewal_status?'selected':''}>${o}</option>`).join('');
  return `<select class="rsel" onchange="setRenewal('${esc(c.id)}',this)">${opts}</select>`;
}

function renderTable(){
  const fn=FILTERS.find(f=>f[0]===filter)[2];
  const rows=data.contracts.filter(fn).filter(c=>{
    if(!query)return true;
    const hay=[c.contract_no,c.company_name,c.contact_person,c.contact_phone,c.contact_email,...c.cabins.map(l=>l.cabin_number)].join(' ').toLowerCase();
    return hay.includes(query);
  });
  if(!rows.length){
    $('tbody').innerHTML=`<tr><td colspan="9" class="empty">${data.contracts.length?'No contracts match this view.':'No contracts yet. Add the first one with “+ New contract”.'}</td></tr>`;
    return;
  }
  $('tbody').innerHTML=rows.map(c=>{
    const acts=c.phase==='terminated'?'':
      `<button class="abtn" onclick="openForm('edit','${esc(c.id)}')">Edit</button>
       <button class="abtn" onclick="openForm('renew','${esc(c.id)}')">Renew</button>
       <button class="abtn danger" onclick="confirmThenRun(this,()=>terminate('${esc(c.id)}'))">Terminate</button>`;
    return `<tr>
      <td>${esc(c.contract_no||'—')}</td>
      <td><div class="co">${esc(c.company_name)}</div><div class="sub">${esc(c.contact_person)} · ${esc(c.contact_phone)}</div><div class="sub">${esc(c.contact_email)}</div></td>
      <td>${c.cabins.map(l=>`<span class="tag">${esc(l.cabin_number)}</span>`).join('')}</td>
      <td>${c.total_seats}</td>
      <td>${inr(c.monthly_rent)}</td>
      <td>${fmtDate(c.start_date)}<div class="sub">→ ${fmtDate(c.end_date)}</div></td>
      <td>${phaseBadge(c)}<div class="sub">${daysLeft(c)}</div></td>
      <td>${renewalCell(c)}</td>
      <td><div class="actions">${acts}</div></td>
    </tr>`;
  }).join('');
}

/* ── two-click confirm (same pattern as the floor plan's Bookings tab) ── */
function confirmThenRun(btn,runFn){
  if(btn.dataset.confirming==='1'){
    clearTimeout(btn._t);btn.dataset.confirming='0';runFn();return;
  }
  btn.dataset.confirming='1';btn._orig=btn.textContent;btn.textContent='Click again to confirm';
  btn._t=setTimeout(()=>{btn.dataset.confirming='0';btn.textContent=btn._orig;},4000);
}

/* ── row actions ── */
async function terminate(id){
  const r=await apiFetch('/api/contracts?id='+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'terminate'})});
  const d=await r.json().catch(()=>({}));
  if(r.ok&&d.status==='success'){notify('Contract terminated.','ok');load();}
  else notify(d.error||'Could not terminate the contract.','err');
}

async function setRenewal(id,sel){
  const r=await apiFetch('/api/contracts?id='+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'renewal_status',renewal_status:sel.value})});
  const d=await r.json().catch(()=>({}));
  if(r.ok&&d.status==='success'){notify('Renewal status updated.','ok');load();}
  else{notify(d.error||'Could not update the renewal status.','err');load();}
}

/* ── create / edit / renew form ── */
function openForm(mode,id,presetItemId){
  const c=id?data.contracts.find(x=>x.id===id):null;
  form={mode,id:c?c.id:null,excludeId:mode==='create'?null:(c?c.id:null),cabins:{}};
  const tags={create:'New contract',edit:'Edit contract',renew:'Renew contract'};
  $('mTag').textContent=tags[mode];
  $('mTitle').textContent=c?c.company_name:curLoc;
  $('mSub').textContent=mode==='renew'?'Next term — dates and cabins are prefilled from the current contract.':`${curLoc} · private cabins only`;
  $('mSubmit').textContent=mode==='edit'?'Save changes':(mode==='renew'?'Create renewal':'Create contract');
  $('mErr').textContent='';
  $('mSubmit').disabled=false;

  const meta=$('mMeta');
  if(c&&mode==='edit'){
    meta.style.display='';
    meta.innerHTML=`${esc(c.contract_no||'')} · Renewal: <b>${esc(c.renewal_status)}</b>${c.renewal_notice_sent_on?` (notice sent ${esc(c.renewal_notice_sent_on)})`:''}${c.renewed_from?' · renewal of an earlier contract':''}`;
  }else meta.style.display='none';

  const today=data.today;
  if(c){
    $('fCompany').value=c.company_name;$('fPerson').value=c.contact_person;$('fPhone').value=c.contact_phone;$('fEmail').value=c.contact_email;
    $('fDeposit').value=c.security_deposit||'';$('fNotes').value=c.notes;
    c.cabins.forEach(l=>{form.cabins[l.item_id]={seats:l.seats,price:l.monthly_price};});
    if(mode==='renew'){
      const span=diffDays(c.start_date,c.end_date);
      const start=addDays(c.end_date,1);
      $('fStart').value=start;$('fEnd').value=addDays(start,span);
    }else{$('fStart').value=c.start_date;$('fEnd').value=c.end_date;}
  }else{
    ['fCompany','fPerson','fPhone','fEmail','fDeposit','fNotes'].forEach(k=>{$(k).value='';});
    $('fStart').value=today;$('fEnd').value=addDays(addDays(today,365),-1);
    const preset=presetItemId&&data.cabins.find(x=>x.item_id===presetItemId);
    if(preset)form.cabins[preset.item_id]={seats:preset.seats,price:''};
  }
  renderPicker();
  $('ovl').classList.add('open');
}

function closeForm(){$('ovl').classList.remove('open');form=null;}

function conflictFor(cabin){
  const s=$('fStart').value,e=$('fEnd').value;
  if(!s||!e)return null;
  return data.contracts.find(c=>c.id!==form.excludeId&&c.phase!=='terminated'&&
    c.cabins.some(l=>l.item_id===cabin.item_id)&&c.start_date<=e&&c.end_date>=s)||null;
}

function renderPicker(){
  if(!form)return;
  $('pickHint').textContent=data.cabins.length?'— greyed-out cabins are taken for these dates':'';
  $('picker').innerHTML=data.cabins.map(c=>{
    const sel=!!form.cabins[c.item_id];
    const clash=conflictFor(c);
    const cls=sel?'sel':(clash?'dis':'');
    const title=clash?`title="${esc('Under contract '+(clash.contract_no||clash.company_name))}"`:'';
    return `<button type="button" class="pchip ${cls}" ${title} data-id="${esc(c.item_id)}" ${clash&&!sel?'disabled':''}>${esc(c.cabin_number)} · ${c.seats}</button>`;
  }).join('')||'<span class="sub">No leasable cabins found.</span>';

  const selHead=Object.keys(form.cabins).length?'<div class="sel-row sel-hdr"><span>Cabin</span><span>Seats</span><span>Monthly price (₹)</span><span></span></div>':'';
  $('selRows').innerHTML=selHead+Object.entries(form.cabins).map(([id,v])=>{
    const cabin=data.cabins.find(c=>c.item_id===id);
    if(!cabin)return '';
    const clash=conflictFor(cabin);
    return `<div>
      <div class="sel-row" data-id="${esc(id)}">
        <b>${esc(cabin.cabin_number)}</b>
        <input type="number" min="1" step="1" value="${esc(v.seats)}" data-f="seats" placeholder="Seats"/>
        <input type="number" min="0" step="1" value="${esc(v.price)}" data-f="price" placeholder="Monthly price ₹"/>
        <button type="button" class="rm" data-rm="${esc(id)}">✕</button>
      </div>
      ${clash?`<div class="warn-note">Overlaps ${esc(clash.contract_no||clash.company_name)} for these dates.</div>`:''}
    </div>`;
  }).join('');
  updateTotals();
}

function updateTotals(){
  const list=Object.values(form.cabins);
  const seats=list.reduce((s,v)=>s+(Number(v.seats)||0),0);
  const rent=list.reduce((s,v)=>s+(Number(v.price)||0),0);
  $('totals').textContent=list.length?`${list.length} cabin${list.length===1?'':'s'} · ${seats} seats · ${inr(rent)} / month`:'No cabins selected';
}

$('picker').addEventListener('click',e=>{
  const b=e.target.closest('.pchip');
  if(!b||b.disabled)return;
  const id=b.dataset.id;
  if(form.cabins[id])delete form.cabins[id];
  else{const cabin=data.cabins.find(c=>c.item_id===id);form.cabins[id]={seats:cabin.seats,price:''};}
  renderPicker();
});

$('selRows').addEventListener('input',e=>{
  const row=e.target.closest('.sel-row');
  if(!row||!e.target.dataset.f)return;
  form.cabins[row.dataset.id][e.target.dataset.f]=e.target.value;
  updateTotals();
});

$('selRows').addEventListener('click',e=>{
  const rm=e.target.closest('[data-rm]');
  if(!rm)return;
  delete form.cabins[rm.dataset.rm];
  renderPicker();
});

async function submitForm(){
  const err=$('mErr');err.textContent='';
  const body={
    company_name:$('fCompany').value,contact_person:$('fPerson').value,contact_phone:$('fPhone').value,contact_email:$('fEmail').value,
    start_date:$('fStart').value,end_date:$('fEnd').value,security_deposit:$('fDeposit').value,notes:$('fNotes').value,
    cabins:Object.entries(form.cabins).map(([item_id,v])=>({item_id,seats:v.seats,monthly_price:v.price}))
  };
  const {mode,id}=form;
  const url=mode==='edit'?'/api/contracts?id='+encodeURIComponent(id):(mode==='renew'?'/api/contracts?action=renew&id='+encodeURIComponent(id):'/api/contracts');
  const btn=$('mSubmit');btn.disabled=true;const label=btn.textContent;btn.textContent='Saving…';
  try{
    const r=await apiFetch(url,{method:mode==='edit'?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({}));
    if(r.ok&&d.status==='success'){
      closeForm();
      notify(d.warning||d.message||'Saved.',d.warning?'warn':'ok');
      load();
      return;
    }
    err.textContent=d.error||'Could not save the contract.';
  }catch(e){
    err.textContent='Could not reach the server.';
  }
  btn.disabled=false;btn.textContent=label;
}

$('ovl').addEventListener('click',e=>{if(e.target.id==='ovl')closeForm();});
load();
</script>
